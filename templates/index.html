<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fake News Detection AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(-45deg,#0f172a,#2563eb,#06b6d4,#0f766e);

background-size:400% 400%;

animation:gradient 12s ease infinite;

}

@keyframes gradient{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

.container{

width:750px;

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

box-shadow:0 10px 35px rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.25);

text-align:center;

color:white;

}

h1{

font-size:40px;

margin-bottom:10px;

}

.subtitle{

font-size:17px;

opacity:.9;

margin-bottom:30px;

}

textarea{

width:100%;

height:220px;

padding:18px;

border-radius:15px;

border:none;

outline:none;

resize:none;

font-size:16px;

background:rgba(255,255,255,.92);

color:#111827;

}

textarea::placeholder{

color:#6b7280;

}

button{

margin-top:25px;

padding:15px 45px;

font-size:18px;

border:none;

border-radius:12px;

cursor:pointer;

background:#10b981;

color:white;

font-weight:bold;

transition:.3s;

}

button:hover{

transform:scale(1.05);

background:#059669;

box-shadow:0 0 20px rgba(16,185,129,.6);

}

.result{

margin-top:30px;

padding:20px;

border-radius:15px;

font-size:28px;

font-weight:bold;

}

.real{

background:#dcfce7;

color:#166534;

}

.fake{

background:#fee2e2;

color:#991b1b;

}

footer{

margin-top:25px;

font-size:14px;

opacity:.8;

}
footer{
    margin-top:25px;
    font-size:14px;
    opacity:.8;
}

/* PASTE THE NEW CSS HERE */

.result{
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    animation:fadeIn .5s ease;
}

.real{
    background:#d4edda;
    color:#155724;
    border:2px solid #28a745;
}

.fake{
    background:#f8d7da;
    color:#721c24;
    border:2px solid #dc3545;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>

</head>

<body>

<div class="container">

<h1>🤖 Fake News Detection AI</h1>

<p class="subtitle">
Analyze any news article using Machine Learning.
</p>

<form method="POST" id="newsForm">

<textarea
name="news"
placeholder="Paste your news article here..."
required></textarea>

<br>

<button type="submit" id="analyzeBtn">
🔍 Analyze News
</button>

<!-- Prediction block -->

<!-- Prediction block -->

</form>

{% if prediction %}

<div class="result {% if prediction == 'Real News' %}real{% else %}fake{% endif %}">
    <h2>
        {% if prediction == "Real News" %}
            ✅ REAL NEWS
        {% else %}
            ❌ FAKE NEWS
        {% endif %}
    </h2>

    <p>{{ prediction }}</p>

<p style="font-size:18px; margin-top:10px;">
    <strong>Confidence:</strong> {{ confidence }}%
</p>
    </p>

</div>

{% endif %}

<footer>
    Made with ❤️ using Python, Flask & Machine Learning

<footer>



</footer>

</div>

<script>
const form = document.getElementById("newsForm");
const button = document.getElementById("analyzeBtn");

form.addEventListener("submit", function () {
    button.innerHTML = "⏳ Analyzing...";
    button.disabled = true;
});
</script>

</body>
</html>
